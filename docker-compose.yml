services:
  quota-monitor:
    build: .
    image: ${QUOTA_IMAGE:-ghcr.io/huozao/ai-quota-monitor:latest}
    container_name: quota-monitor
    restart: unless-stopped
    environment:
      DISPLAY: ":101"
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD}
      CHROME_PROXY_SERVER: ${CHROME_PROXY_SERVER:-}
      QUOTA_NOVNC_PORT: "6082"
      QUOTA_DATA_DIR: /app/quota_data
      QUOTA_PROFILE_DIR: /app/quota_browser_data
      QUOTA_POLL_MINUTES_MIN: ${QUOTA_POLL_MINUTES_MIN:-20}
      QUOTA_POLL_MINUTES_MAX: ${QUOTA_POLL_MINUTES_MAX:-30}
      QUOTA_PAGE_SETTLE_SECONDS: ${QUOTA_PAGE_SETTLE_SECONDS:-5}
      QUOTA_RETENTION_DAYS: ${QUOTA_RETENTION_DAYS:-7}
      QUOTA_REPORT_TIMES: ${QUOTA_REPORT_TIMES:-08:00,13:00,20:00}
      QUOTA_PUBLIC_API_PREFIX: ${QUOTA_PUBLIC_API_PREFIX:-/console/quota/api}
      QUOTA_PUBLIC_LINK: ${QUOTA_PUBLIC_LINK:-}
      NOTIFY_ENDPOINT: ${NOTIFY_ENDPOINT:-}
      NOTIFY_SOURCE_TOKEN: ${NOTIFY_SOURCE_TOKEN:-}
    ports:
      - "${HOST_QUOTA_API_BIND:-127.0.0.1}:${HOST_QUOTA_API_PORT:-18002}:8001"
      - "${HOST_QUOTA_NOVNC_BIND:-127.0.0.1}:${HOST_QUOTA_NOVNC_PORT:-6082}:6082"
    volumes:
      - ${HOST_QUOTA_BROWSER_DATA_DIR:-/var/lib/ai-quota-monitor/browser_data}:/app/quota_browser_data
      - ${HOST_QUOTA_DATA_DIR:-/var/lib/ai-quota-monitor/data}:/app/quota_data
      - ${HOST_QUOTA_LOGS_DIR:-/var/log/ai-quota-monitor}:/app/quota_logs
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
